<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social Publisher · 合成预览</title><link rel="stylesheet" href="/styles.css">
<style>
body{margin:0;background:#f5f5f7;color:#24242b;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.demo-window{height:100vh;display:grid;grid-template-rows:36px 1fr}.demo-title{display:flex;align-items:center;justify-content:center;border-bottom:1px solid #dedee5;font-size:13px;position:relative}.demo-dots{position:absolute;left:14px;display:flex;gap:9px}.demo-dots i{width:12px;height:12px;border-radius:50%;background:#f56c64}.demo-dots i:nth-child(2){background:#f7c548}.demo-dots i:nth-child(3){background:#58c864}.demo-body{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:0}.demo-sidebar{border-right:1px solid #dedee5;padding:20px 18px;background:#f6f6f8}.demo-sidebar strong{font-size:14px}.demo-sidebar p{font-size:13px;padding:9px 8px;margin:12px 0}.demo-sidebar p.active{background:#eae8ee;border-radius:4px}.demo-sidebar .demo-file{font-size:12px;color:#666675;padding-left:24px}.demo-tab{height:40px;background:#fff;border-bottom:1px solid #e4e4eb;display:flex;align-items:center;font-size:13px;padding:0 24px}.demo-surface{display:grid;grid-template-rows:40px minmax(0,1fr);overflow:hidden}.demo-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#292631;color:white;padding:12px 20px;border-radius:6px;z-index:100;max-width:80vw;font-size:13px}@media(max-width:900px){.demo-sidebar{display:none}.demo-body{grid-template-columns:1fr}}
</style></head>
<body><div class="demo-window"><div class="demo-title"><div class="demo-dots"><i></i><i></i><i></i></div>Obsidian · 合成示例预览</div><div class="demo-body"><aside class="demo-sidebar"><strong>演示知识库</strong><p>内容创作</p><p class="active">发布作品</p><p class="demo-file">AI 的三个步骤</p><p class="demo-file">Obsidian 素材整理</p><p class="demo-file">标题练习</p><p>创作笔记</p></aside><div class="demo-surface"><div class="demo-tab">Social Publisher</div><div id="app"></div></div></div></div><script src="/demo.js" type="module"></script></body></html>
